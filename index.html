<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Avocrypto | Login</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Avocrypto Style -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 py-4">

    <!-- LOGIN CONTAINER CARD -->
    <div class="login-container p-4 p-sm-5">

        <!-- HEADER / LOGO -->
        <div class="login-header text-center mb-4">
            <div class="brand-logo-lg mx-auto mb-3 d-flex align-items-center justify-content-center">
                <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C7 2 3 8 3 13C3 18 7 22 12 22C17 22 21 18 21 13C21 8 17 2 12 2Z" fill="#B7E86A" />
                    <circle cx="12" cy="14" r="4" fill="#7A4528" />
                </svg>
            </div>
            <h1 class="brand-title-lg mb-1">AVOCRYPTO</h1>
            <p class="login-subtitle">Acesse sua conta para acompanhar o mercado</p>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <form id="form-login" onsubmit="return false;">

            <!-- CAMPO EMAIL / USUARIO -->
            <div class="input-group-custom mb-3">
                <label for="email" class="input-label">E-mail ou Usuário</label>
                <div class="input-wrapper">
                    <i class="bi bi-envelope input-icon"></i>
                    <input type="email" id="email" class="form-control-avo" placeholder="seu@email.com" required
                        autocomplete="email">
                </div>
            </div>

            <!-- CAMPO SENHA -->
            <div class="input-group-custom mb-3">
                <label for="password" class="input-label">Senha</label>
                <div class="input-wrapper">
                    <i class="bi bi-lock input-icon"></i>
                    <input type="password" id="password" class="form-control-avo" placeholder="••••••••" required
                        autocomplete="current-password">

                </div>
            </div>

            <!-- LEMBRAR-ME & ESQUECEU A SENHA -->
            <div class="d-flex justify-content-between align-items-center mb-4 fs-8">
                <div class="form-check custom-checkbox">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-muted" for="rememberMe">
                        Lembrar-me
                    </label>
                </div>
                <a href="#" class="link-forgot">Esqueceu a senha?</a>
            </div>

            <!-- BOTAO PRINCIPAL DE ENTAR -->
            <button type="submit" class="btn btn-avo-primary w-100 py-3 mb-3 fw-bold" onclick="criarConta()">
                Entrar na Conta
            </button>

            <!-- DIVISOR -->
            <div class="divider d-flex align-items-center my-3">
                <span>ou</span>
            </div>

            <!-- LOGIN COM BIOMETRIA / RÁPIDO -->
            <button type="button"
                class="btn btn-avo-outline w-100 py-2 d-flex align-items-center justify-content-center gap-2 mb-4">
                <i class="bi bi-fingerprint fs-5"></i>
                <span>Entrar com Biometria</span>
            </button>

            <!-- CADASTRO -->
            <div class="auth-links text-center">
                <span class="text-muted fs-8">Ainda não tem uma conta?</span>
                <a href="#" class="link-register fw-bold ms-1 fs-8">Criar conta</a>
            </div>

        </form>
    </div>
    <!-- ALERTA DE ERRO -->
    <div id="alertBad" class="alert-badge alert-error" style="display: none;">
        <span class="alert-icon">!</span>

        <div class="alert-content">
            <strong>Ops!</strong>
            <span id="avisoRuim"></span>
        </div>

        <button onclick="document.getElementById('alertBad').style.display='none'">
            ×
        </button>
    </div>


    <!-- ALERTA DE SUCESSO -->
    <div id="alertGood" class="alert-badge alert-success" style="display: none;">
        <span class="alert-icon">✓</span>

        <div class="alert-content">
            <strong>Sucesso!</strong>
            <span>Conta criada com sucesso.</span>
        </div>

        <button onclick="document.getElementById('alertGood').style.display='none'">
            ×
        </button>
    </div>


    <!-- LOADING -->
    <div style="display: none;" id="loading">
        <div class="bola-loading"></div>
    </div>
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script src="./jS/login.js"></script>
</body>

</html>
